[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "macro-research-agent"
version = "0.1.0"
description = "Local-first, review-gated macroeconomic research agent"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "pydantic>=2.8,<3",
  "httpx>=0.27,<1",
  "python-multipart>=0.0.9,<1",
  "pandas>=2.2,<3",
  "openpyxl>=3.1,<4",
  "xlsxwriter>=3.2,<4",
  "pyarrow>=17,<23",
  "statsmodels>=0.14,<1",
  "scipy>=1.11,<1.15",
  "resvg-py>=0.5,<0.6",
  "pillow>=12,<13",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
  "pytest-asyncio>=0.24,<2",
  "ruff>=0.8,<1",
  "mypy>=1.13,<2",
]

[tool.setuptools]
package-dir = {"" = "backend/src"}

[tool.setuptools.packages.find]
where = ["backend/src"]

[tool.setuptools.package-data]
macro_research_agent = ["knowledge/*.json", "knowledge/*.sqlite3"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["backend/src"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.10"
strict = true
packages = ["macro_research_agent"]
mypy_path = "backend/src"
